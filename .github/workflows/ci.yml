name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: NODE_ENV=test npm test
      - run: node --check server/games.js
      - run: node --check server/economy.js
      - run: node --check server/mongo-store.js
