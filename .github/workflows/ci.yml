name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase2-game-authority]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check server/games.js
      - run: node --check server/economy.js
